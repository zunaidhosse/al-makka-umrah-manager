<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="যাত্রী প্যাকেজ তালিকা - হাজী ও ওমরাহ যাত্রীদের ম্যানেজমেন্ট অ্যাপ" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="প্যাকেজ তালিকা" />
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <title>যাত্রী প্যাকেজ তালিকা</title>
  </head>
  <body class="bg-emerald-950/5 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-amber-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).then(function(reg) {
            console.log('SW registered:', reg);
          }).catch(function(err) {
            console.log('SW reg failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
